spring.datasource.url=jdbc:mysql://localhost:3306/inventory_system_db
spring.datasource.username=root
spring.datasource.password=Akasha@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# DDL auto-generation strategy (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console logs (Useful for development)
spring.jpa.show-sql=true

# Format the SQL logs cleanly instead of keeping them on a single line
spring.jpa.properties.hibernate.format_sql=true

# Highlight SQL commands with ANSI colors in the console logs
spring.jpa.properties.hibernate.highlight_sql=true

# Database Platform / Dialect (Optional: Spring Boot auto-detects this based on your URL)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect